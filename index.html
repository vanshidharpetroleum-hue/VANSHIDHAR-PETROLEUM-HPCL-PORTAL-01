<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanshidhar Petroleum Portal</title>
</head>
<body>
  <h1>Vanshidhar Petroleum</h1>
  <h2>HPCL Pansa</h2>

  <p>Daily Business Management Portal</p>

  <hr>

  <h3>आज की Entry</h3>

  <label>Date:</label>
  <input type="date">

  <br><br>

  <label>MS Sales (Litres):</label>
  <input type="number" placeholder="MS Sales">

  <br><br>

  <label>HSD Sales (Litres):</label>
  <input type="number" placeholder="HSD Sales">

  <br><br>

  <label>Purchase:</label>
  <input type="number" placeholder="Purchase Amount">

  <br><br>

  <label>Expense:</label>
  <input type="number" placeholder="Expense Amount">

  <br><br>

  <button>Save Entry</button>

  <hr>

  <h3>Reports</h3>
  <p>Sales | Purchase | Expense | Debit | Credit | Profit & Loss | Stock</p>

</body>
</html>
