<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pump Dashboard</title>
<link rel="manifest" href="wallpaper.webmanifest"><link rel="icon" href="icons/favicon.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="theme-color" content="#0b1730">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b1730;color:#eaf1fb;font-family:Arial,system-ui,sans-serif;overflow:hidden}
.wrap{height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;gap:1.4vh;padding:2.2vh 2.4vw}
.top{display:flex;justify-content:space-between;align-items:flex-end}
.top h1{margin:0;font-size:3.2vh;letter-spacing:.5px}.top .s{font-size:1.7vh;color:#9fb3cf;margin-top:.4vh}
.clock{text-align:right}.clock .t{font-size:5vh;font-weight:800}.clock .d{font-size:1.8vh;color:#9fb3cf}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vh 1vw}
.k{background:#13254a;border:1px solid #213a6b;border-radius:1.2vh;padding:1.4vh 1.2vw}
.k .l{font-size:1.5vh;color:#9fb3cf;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.k .v{font-size:3.4vh;font-weight:800;margin-top:.6vh;white-space:nowrap}.k .x{font-size:1.5vh;color:#9fb3cf;margin-top:.3vh}
.pos{color:#4ade80}.neg{color:#f87171}.warn{color:#fbbf24}
.charts{display:grid;grid-template-columns:2fr 1fr;gap:1vw;min-height:0}
.box{background:#13254a;border:1px solid #213a6b;border-radius:1.2vh;padding:1.2vh 1vw;display:flex;flex-direction:column;min-height:0}
.box h3{margin:0 0 .8vh;font-size:1.8vh;color:#cfe0f7}.ch{position:relative;flex:1;min-height:0}
.foot{display:flex;justify-content:space-between;font-size:1.4vh;color:#7f93b0}
@media (orientation:portrait){html,body{overflow:auto}.wrap{height:auto;min-height:100vh;padding:2vh 3vw}.top h1{font-size:2.2vh}.grid{grid-template-columns:1fr 1fr}.k .v{font-size:2.6vh}.charts{grid-template-columns:1fr}.box{height:300px}.clock .t{font-size:3.2vh}.top{align-items:flex-start;gap:8px}}
.lock .top,.lock .charts,.lock .foot{display:none}.lock .wrap{padding-top:34vh;grid-template-rows:auto auto;height:100vh;overflow:hidden}
.lock .grid{grid-template-columns:1fr 1fr}.lock .k{background:rgba(19,37,74,.85)}.lock .k .v{font-size:2.9vh}.lock .lt{display:block!important;text-align:center;font-size:1.6vh;color:#9fb3cf;margin-top:1vh}
.img .clock,.img .foot span:last-child{display:none}.img .wrap{padding-bottom:16vh}
</style></head><body><div class="wrap">
<div class="top"><div><h1>⛽ VANSHIDHAR PETROLEUM · HPCL PANSA</h1><div class="s" id="sub"></div></div><div class="clock"><div class="t" id="t"></div><div class="d" id="d"></div></div></div>
<div class="grid" id="kp"></div><div class="lt" id="lt" style="display:none"></div>
<div class="charts"><div class="box"><h3>Pichhle 14 din ki bikri (Litre)</h3><div class="ch"><canvas id="c1"></canvas></div></div>
<div class="box"><h3>Is mahine paisa kahan se aaya</h3><div class="ch"><canvas id="c2"></canvas></div></div></div>
<div class="foot"><span id="up"></span><span>Har 5 minute me apne aap update · DKC</span></div>
</div>
<script>
const D=/*DATA*/null;
if(location.search.includes('lock'))document.documentElement.classList.add('lock');
if(location.search.includes('img'))document.documentElement.classList.add('img');
if(location.protocol.startsWith('http'))setInterval(()=>{if(navigator.onLine)location.reload()},5*60*1000);
const ind=v=>(v<0?'-':'')+Math.abs(Math.round(v)).toLocaleString('en-IN'), R=v=>(v<0?'-₹':'₹')+Math.abs(Math.round(v)).toLocaleString('en-IN');
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dd=s=>s.slice(8,10)+' '+MN[+s.slice(5,7)-1];
function tick(){const n=new Date();document.getElementById('t').textContent=n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});document.getElementById('d').textContent=n.toLocaleDateString('hi-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
tick();setInterval(tick,20000);
const daily=D.daily, L=daily[daily.length-1], P=daily[daily.length-2]||L, mon=L.d.slice(0,7), M=daily.filter(x=>x.d.startsWith(mon));
const S=(a,k)=>a.reduce((s,x)=>s+x[k],0), De=D.desh||{};
const g=k=>{for(const key in De) if(key.toLowerCase().startsWith(k.toLowerCase())) return De[key]; return null};
document.getElementById('sub').textContent='Aakhri DSR: '+dd(L.d)+' · Data update: '+D.built;
document.getElementById('up').textContent='Data: '+D.built;document.getElementById('lt').textContent='⛽ Vanshidhar Petroleum · Aakhri DSR '+dd(L.d)+' · Update '+D.built;
const ch=(a,b)=>{if(!b)return '';const p=(a-b)/b*100;return `<span class="${p>=0?'pos':'neg'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(0)}% kal se</span>`};
const k=(l,v,x,c)=>`<div class="k"><div class="l">${l}</div><div class="v ${c||''}">${v}</div><div class="x">${x||''}</div></div>`;
const sh=L.short, msh=S(M,'short'), op=g('Operating Profit'), udh=g('Credit Sale Udhar');
document.getElementById('kp').innerHTML=
 k('Aakhri din ki bikri ('+dd(L.d)+')',R(L.total),ch(L.total,P.total))+
 k('MS / HSD ('+dd(L.d)+')',ind(L.ms)+' / '+ind(L.hsd)+' L','Kul '+ind(L.ms+L.hsd)+' L')+
 k('Short / (Excess) '+dd(L.d),R(sh),Math.abs(sh)<=500?'Theek hai ✅':'Jaanch kariye ⚠️',Math.abs(sh)<=500?'pos':'warn')+
 k(MN[+mon.slice(5,7)-1]+' ki bikri (ab tak)',R(S(M,'total')),M.length+' din · roz '+R(S(M,'total')/M.length))+
 k('SBI CC Balance',g('CC Account')!=null?R(g('CC Account')):'-','Register ke hisaab se','pos')+
 k('Chalu Udhar',udh!=null?R(udh):'-','Tutu/Roushan ke bina',udh>100000?'warn':'')+
 k('Operating Profit (Aug se)',op!=null?R(op):'-','HPCL byaj '+R(g('Total Debit Interest')||0),op<0?'neg':'pos')+
 k(MN[+mon.slice(5,7)-1]+' Short/(Excess)',R(msh),'Naya udhar '+R(S(M,'credit')),Math.abs(msh)<=1000?'pos':'warn');
Chart.defaults.color='#9fb3cf';Chart.defaults.borderColor='#213a6b';
const T=daily.slice(-14);
new Chart(document.getElementById('c1'),{type:'bar',data:{labels:T.map(x=>dd(x.d)),datasets:[{label:'MS',data:T.map(x=>x.ms),backgroundColor:'#22c55e'},{label:'HSD',data:T.map(x=>x.hsd),backgroundColor:'#3b82f6'}]},
 options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{position:'top'}},scales:{x:{stacked:true},y:{stacked:true}}}});
new Chart(document.getElementById('c2'),{type:'doughnut',data:{labels:['Cash','UPI','Udhar','Owner','Party'],datasets:[{data:['cash','upi','credit','owner','party'].map(x=>S(M,x)),backgroundColor:['#22c55e','#3b82f6','#f59e0b','#a855f7','#64748b'],borderWidth:0}]},
 options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{position:'right'}}}});
</script></body></html>
